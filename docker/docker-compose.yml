version: '3.8'

services:
  ai-agent:
    image: nanzi-ai-agent:latest
    container_name: nanzi-ai-agent
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ~/.agents/skills:/app/data/skills
    environment:
      # Service Config
      - API_SERVICE_ENV=${API_SERVICE_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # 业务默认时区（与系统配置 platform_timezone 默认值一致；无法改 MySQL 时仍可对齐应用写入时间）
      - TZ=${TZ:-Asia/Shanghai}
      - PLATFORM_TIMEZONE=${PLATFORM_TIMEZONE:-Asia/Shanghai}

      # Main database
      - DATABASE_TYPE=${DATABASE_TYPE:-mysql}

      # MySQL (Mock / External)
      - MYSQL_HOST=${MYSQL_HOST:-mysql} # 假设有名为 mysql 的服务或外部注入
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB:-nanzi_ai_agent_platform}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}

      # PostgreSQL (used when DATABASE_TYPE=postgresql)
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-nanzi_ai_agent_platform}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      # Redis (Internal Service)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_ENABLE=${REDIS_ENABLE:-true}

      # Security
      - API_SERVICE_API_KEY_HASH_ALGORITHM=${API_SERVICE_API_KEY_HASH_ALGORITHM:-sha256}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}

      # Jira Integration
      - JIRA_URL=${JIRA_URL}
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_PASSWORD=${JIRA_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    container_name: nanzi-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - redis-stack-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
